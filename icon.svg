<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fond noir -->
  <rect width="512" height="512" rx="100" fill="#050505"/>
  
  <!-- Pokéball - moitié rouge -->
  <clipPath id="top">
    <rect x="56" y="56" width="400" height="200"/>
  </clipPath>
  <circle cx="256" cy="256" r="200" fill="#d9ac45" clip-path="url(#top)"/>
  
  <!-- Pokéball - moitié noire -->
  <clipPath id="bot">
    <rect x="56" y="256" width="400" height="200"/>
  </clipPath>
  <circle cx="256" cy="256" r="200" fill="#0c0b09" clip-path="url(#bot)"/>
  
  <!-- Bordure extérieure -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#d9ac45" stroke-width="12"/>
  
  <!-- Ligne centrale -->
  <rect x="56" y="244" width="400" height="24" fill="#d9ac45"/>
  
  <!-- Cercle central extérieur -->
  <circle cx="256" cy="256" r="52" fill="#d9ac45"/>
  
  <!-- Cercle central intérieur -->
  <circle cx="256" cy="256" r="36" fill="#050505" stroke="#d9ac45" stroke-width="8"/>
  
  <!-- Point central -->
  <circle cx="256" cy="256" r="16" fill="#d9ac45"/>
</svg>
