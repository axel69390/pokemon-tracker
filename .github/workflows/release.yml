name: Release build
# Stamps a new build (tools/release.py) after every change to the app made on GitHub, so that open apps reload
# and no browser mixes cached and fresh files. Commits made by this workflow do not trigger it again.
on:
  push:
    branches: [main]
    paths:
      - 'assets/js/**'
      - 'assets/css/**'
      - 'index.html'
      - 'cardvault/index.html'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the JavaScript
        run: for f in $(find assets/js -name '*.js'); do node --check "$f" || exit 1; done
      - name: Stamp the build
        run: python3 tools/release.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A assets/js index.html cardvault/index.html version.json
          git diff --cached --quiet && exit 0
          git commit -m "Build $(python3 -c 'import json;print(json.load(open("version.json"))["version"])')"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
