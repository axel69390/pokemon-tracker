name: Sealed prices
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - tools/build_prices.py
      - tools/build_gcc.py
      - tools/build_cm.py
      - tools/build_market.py
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sealed catalogue
        continue-on-error: true
        run: python3 tools/build_sealed.py
      - run: python3 tools/build_prices.py
      - name: GCC (French market)
        continue-on-error: true
        run: python3 tools/build_gcc.py
      - name: Cardmarket
        continue-on-error: true
        run: python3 tools/build_cm.py
      - name: eBay listings
        continue-on-error: true
        run: python3 tools/build_ebay.py
      - name: Price index
        run: python3 tools/build_market.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data/sealed-prices.json
          git add assets/data/sealed.json || true
          git add assets/data/sealed-gcc.json || true
          git add assets/data/sealed-cm.json || true
          git add assets/data/sealed-ebay.json || true
          git add assets/data/sealed-market.json || true
          git diff --cached --quiet || (git commit -m "Update sealed prices" && git push)
